name: Deploy WebGL via Pages Artifact

on:
  push:
    branches: [ main ]          # Repo A가 실제로 푸시하는 브랜치와 동일
  repository_dispatch:
    types: [deploy_pages]
  workflow_dispatch:             # (선택) 수동 실행 허용

permissions:
  pages: write
  id-token: write
  contents: read
  actions: read

concurrency:
  group: pages-deploy
  cancel-in-progress: false   # 진행 중인 Pages 배포는 취소 금지(GitHub 공식 권장). 취소 시 환경이 막혀 다음 배포가 실패함.

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # (재실행 대비) 같은 run 안에 남아있을 수 있는 'github-pages' 아티팩트 선삭제
      - name: Pre-clean leftover 'github-pages' artifact (safe for reruns)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REPO="${{ github.repository }}"
          RUN="${{ github.run_id }}"
          curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/$REPO/actions/runs/$RUN/artifacts" > artifacts.json
          IDS=$(jq -r '.artifacts[] | select(.name=="github-pages") | .id' artifacts.json || true)
          for id in $IDS; do
            echo "Deleting artifact id=$id"
            curl -sS -X DELETE -H "Authorization: Bearer $GITHUB_TOKEN" \
                 -H "Accept: application/vnd.github+json" \
                 "https://api.github.com/repos/$REPO/actions/artifacts/$id" || true
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site              # <- Repo A가 푸시한 폴더

      # ── 자동 재시도 배포 (GitHub Pages 백엔드 일시 실패 대비) ──────────────
      # deploy-pages 자체엔 재시도 옵션이 없어서, 스텝을 여러 번 호출해 구제한다.
      # 1·2차는 continue-on-error 로 실패해도 job 을 죽이지 않고,
      # 마지막 시도만 진짜 실패 판정(→ 디스코드 실패 알림)을 낸다.
      # 업로드된 'github-pages' 아티팩트는 성공 시점에만 삭제되므로 재시도 간 재사용된다.
      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before attempt 2
        if: steps.deploy1.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before final attempt
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 60

      # 마지막 시도: continue-on-error 없음 → 여기서 실패하면 job 실패
      - name: Deploy to GitHub Pages (final attempt)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4

      # ✅ 성공만 알림
      - name: Notify Discord — success
        if: ${{ success() && !cancelled() }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PAGE_URL: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
          # Worker에서 보낸 reason 값을 가져옴
          BUILD_REASON: ${{ github.event.client_payload.reason }}
        run: |
          # 기본 메시지 설정
          MSG="페이지 빌드 완료 ${PAGE_URL:-https://jark0213.github.io/aksehrkjlnlnnnjdfk/}"
          
          # 빌드 이유(reason)가 있으면 앞에 추가 (줄바꿈 포함)
          if [ -n "$BUILD_REASON" ]; then
            FINAL_CONTENT="${BUILD_REASON}\n${MSG}"
          else
            FINAL_CONTENT="${MSG}"
          fi
          
          # JSON 페이로드 생성 (jq 없이도 안전하게 구성)
          payload=$(printf '{"content": "%b"}' "$FINAL_CONTENT")
          
          curl -sS -H "Content-Type: application/json" \
               -X POST \
               -d "$payload" \
               "$DISCORD_WEBHOOK_URL"


      # ❌ 실패만 알림 (취소 제외)
      - name: Notify Discord — failure
        if: ${{ failure() && !cancelled()}}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload=$(printf '{"content":"❌ Pages deployment failed 🔎 Logs: %s"}' "$RUN_URL")
          curl -sS -H "Content-Type: application/json" -X POST -d "$payload" "$DISCORD_WEBHOOK_URL"


      # (선택) 배포 후 Pages 아티팩트 깔끔하게 삭제
      - name: Delete Pages artifact via REST API
        if: ${{ success() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REPO="${{ github.repository }}"
          RUN="${{ github.run_id }}"
          curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/$REPO/actions/runs/$RUN/artifacts" > artifacts.json
          IDS=$(jq -r '.artifacts[] | select(.name=="github-pages") | .id' artifacts.json)
          for id in $IDS; do
            echo "Deleting artifact id=$id"
            curl -sS -X DELETE -H "Authorization: Bearer $GITHUB_TOKEN" \
                 -H "Accept: application/vnd.github+json" \
                 "https://api.github.com/repos/$REPO/actions/artifacts/$id"
          done
