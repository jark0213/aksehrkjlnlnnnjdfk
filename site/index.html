<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>LostFace</title>
    <style>
        html, body {
            background: Black;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #gameContainer {
            width: 1280px;
            height: 720px;
            position: relative;
            background: transparent !important;
            transform-origin: top left; /* scale 기준점 */
        }
        #unity-canvas {
            width: 1280px !important;
            height: 720px !important;
            position: absolute;
            top: 0;
            left: 0;
            /* WebGL은 사용자 입력 이벤트 밖의 Cursor.visible=false를 무시함(브라우저 보안 제약) — CSS로 OS 커서를 상시 숨기고 커스텀 커서(CursorManager)만 보인다 */
            cursor: none !important;
        }
        #unity-canvas[data-pixel-art="true"] {
            image-rendering: optimizeSpeed;
            image-rendering: -webkit-crisp-edges;
            image-rendering: -moz-crisp-edges;
            image-rendering: -o-crisp-edges;
            image-rendering: crisp-edges;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: optimize-contrast;
            image-rendering: pixelated;
            -ms-interpolation-mode: nearest-neighbor;
        }
    </style>
    <script>
        document.onmousedown = function(){ window.focus(); };
    </script>
    <script>
        // shrink-to-fit=no → iOS 자동 축소 방지
        (function(){
            const meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=no';
            document.head.appendChild(meta);
        })();
    </script>
</head>
<body>
<div id="gameContainer">
    <canvas id="unity-canvas" data-pixel-art="true"></canvas>
</div>

<script src="Build/b23dd96997961653e2825455633aac82.loader.js"></script>
<script>
    var canvas = document.querySelector('#unity-canvas');
    var container = document.querySelector('#gameContainer');

    var config = {
        dataUrl: "Build/5d406e250c677a742d42bb3e612b78e8.data.unityweb",
        frameworkUrl: "Build/e76257b50c2518daf408d03db346147b.framework.js.unityweb",
        codeUrl: "Build/47064975bdae288ebb34925fde874c7e.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Crumbition",
        productName: "LostFace",
        productVersion: "0.2.0",
        devicePixelRatio: 1 // DPR 고정 → 갑자기 작아지는 문제 방지
    };

    function progressHandler(progress) {
        var percent = (progress * 100) + '%';
        canvas.style.background =
            'linear-gradient(to right, white, white ' + percent +
            ', transparent ' + percent + ', transparent) no-repeat center';
        canvas.style.backgroundSize = '100% 1rem';
    }

    function lockCanvasSize() {
        // CSS 기본 크기
        canvas.style.width  = "1280px";
        canvas.style.height = "720px";
        canvas.width  = 1280;
        canvas.height = 720;

        // PC는 고정
        if (!/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            container.style.transform = "scale(1)";
            return;
        }

        // 모바일만 축소 허용
        var scaleX = window.innerWidth  / 1280;
        var scaleY = window.innerHeight / 720;
        var scale = Math.min(scaleX, scaleY, 1); // 1 이하일 때만 축소
        container.style.transform = "scale(" + scale + ")";
    }

    function notifyUnityResize() {
        if (!window.unityInstance || !window.unityInstance.SendMessage) {
            return;
        }
        window.unityInstance.SendMessage("ResizeManager", "OnResize");
    }

    function handleResize() {
        lockCanvasSize();
        notifyUnityResize();
    }

    createUnityInstance(canvas, config, progressHandler).then(function (instance) {
        window.unityInstance = instance;
        handleResize();
        // 전체화면 중 ESC를 브라우저(전체화면 해제) 대신 게임(팝업 닫기)으로 보낸다 — Keyboard Lock API.
        // Chromium 계열·https 전용(Firefox/Safari는 무시됨). 락 후엔 ESC 길게(약 2초) 눌러야 전체화면 해제.
        if (navigator.keyboard && navigator.keyboard.lock) {
            navigator.keyboard.lock(['Escape']).catch(function(){});
        }
        window.addEventListener('resize', handleResize);
        window.addEventListener('orientationchange', handleResize);
        window.addEventListener('pageshow', handleResize);
    });
</script>
</body>
</html>
